name: Sudoku manual quality gate
# Intentionally no push/pull_request/cron triggers: conserve CI minutes.
# Run manually in Actions, selecting exactly one platform per invocation.
on:
  workflow_dispatch:
    inputs:
      runner_os:
        description: Host runner to test (one platform per invocation)
        required: true
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest
      full_linux_gate:
        description: Run GCC/Clang/Sanitizers/coverage/benchmark (Linux only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ inputs.runner_os }}
    timeout-minutes: 20
    steps:
      - name: Report actual host architecture (platform claims require evidence)
        run: python -c "import platform; print(platform.platform(), platform.machine())"
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Refuse to certify a runner with the wrong CPU architecture
        run: python scripts/verify_runner_platform.py --expected "${{ inputs.runner_os }}"
      - name: Test acceptance guards without C toolchain
        run: python -B -m unittest discover -s tests -p '*_unit.py' -v
      - name: Build, verify development archives, and emit exact-commit receipt
        # A receipt exists only after the quality gate and package verification
        # succeed on the selected host; this workflow remains manual-only.
        run: python scripts/platform_acceptance.py --expected "${{ inputs.runner_os }}" --mode "${{ inputs.full_linux_gate && inputs.runner_os == 'ubuntu-latest' && 'full' || 'fast' }}" --require-sha "${{ github.sha }}"
      - name: Preserve unsigned acceptance evidence for independent review
        # Only retained after the exact-SHA gate and archive checks succeeded.
        # Never publish unlicensed development binaries or a GitHub Release.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sudoku-evidence-${{ inputs.runner_os }}-${{ github.sha }}
          path: |
            dist/platform-receipt.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

